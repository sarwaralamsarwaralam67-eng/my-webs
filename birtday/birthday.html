<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Animation 🎂</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
        }

        #text {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 95%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 60px;
            opacity: 0;
            z-index: 5;
            text-shadow:
                0 0 10px white,
                0 0 25px #ff00cc,
                0 0 50px #ff00cc;
        }

        .show {
            animation: show 1.5s ease forwards;
        }

        .hide {
            animation: hide 1s ease forwards;
        }

        @keyframes show {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0);
            }

            70% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.15);
            }

            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes hide {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(2);
            }
        }

        .name {
            color: #ff4da6;
            font-size: 70px;
            text-shadow:
                0 0 10px #ff4da6,
                0 0 30px #ff1493,
                0 0 60px #ff1493;
        }

        .small {
            font-size: 35px;
        }
    </style>
</head>

<body>

    <canvas id="canvas"></canvas>

    <div id="text"></div>

    <script>

        /* =========================
           BIRTHDAY MESSAGES
           ========================= */

        const scenes = [

            "1",

            "2",

            "3",

            "🎉 HAPPY BIRTHDAY 🎉",

            "💖 WISHING YOU<br>LOTS OF HAPPINESS 💖",

            "✨ MAY ALL YOUR<br>DREAMS COME TRUE ✨",

            "🎂 HAPPY BIRTHDAY<br><span class='name'>meri sweetheart</span> 🎂",

            "🥳 HAVE A WONDERFUL DAY 🥳",

            "❤️ ENJOY YOUR SPECIAL DAY ❤️"

        ];


        /* =========================
           TEXT ANIMATION
           ========================= */

        const text = document.getElementById("text");

        let current = 0;

        function showNext() {

            text.className = "hide";

            setTimeout(function () {

                text.innerHTML = scenes[current];

                text.className = "show";

                current++;

                if (current >= scenes.length) {
                    current = 0;
                }

                setTimeout(showNext, 4000);

            }, 1000);
        }

        showNext();


        /* =========================
           BACKGROUND ANIMATION
           ========================= */

        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;


        /* ❤️ HEARTS */

        let hearts = [];

        class Heart {

            constructor() {

                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 20;
                this.size = Math.random() * 15 + 6;
                this.speed = Math.random() * 2 + 1;
                this.alpha = Math.random();
            }

            update() {

                this.y -= this.speed;
                this.x += Math.sin(this.y / 40);

                if (this.y < -30) {

                    this.y = canvas.height + 30;
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {

                ctx.save();

                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = "#ff1493";

                ctx.shadowBlur = 20;
                ctx.shadowColor = "#ff1493";

                let x = this.x;
                let y = this.y;
                let s = this.size;

                ctx.beginPath();

                ctx.moveTo(x, y);

                ctx.bezierCurveTo(
                    x - s, y - s,
                    x - s * 2, y + s / 2,
                    x, y + s * 1.5
                );

                ctx.bezierCurveTo(
                    x + s * 2, y + s / 2,
                    x + s, y - s,
                    x, y
                );

                ctx.fill();

                ctx.restore();
            }
        }

        for (let i = 0; i < 80; i++) {

            hearts.push(new Heart());

        }


        /* 🎆 FIREWORKS */

        let fireworks = [];

        function createFirework() {

            let x = Math.random() * canvas.width;
            let y = Math.random() * canvas.height * 0.5;

            let particles = [];

            for (let i = 0; i < 50; i++) {

                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 6 + 2;

                particles.push({

                    x: x,
                    y: y,

                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,

                    life: 100

                });

            }

            fireworks.push(particles);
        }

        setInterval(createFirework, 1500);


        /* =========================
           MAIN ANIMATION
           ========================= */

        function animate() {

            ctx.fillStyle = "rgba(0,0,0,0.25)";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /* Hearts */

            hearts.forEach(function (h) {

                h.update();
                h.draw();

            });


            /* Fireworks */

            fireworks.forEach(function (particles) {

                particles.forEach(function (p) {

                    p.x += p.vx;
                    p.y += p.vy;

                    p.vy += 0.05;

                    p.life--;

                    ctx.beginPath();

                    ctx.arc(
                        p.x,
                        p.y,
                        2,
                        0,
                        Math.PI * 2
                    );

                    ctx.fillStyle =
                        `hsl(${Math.random() * 360},100%,70%)`;

                    ctx.shadowBlur = 15;
                    ctx.shadowColor = ctx.fillStyle;

                    ctx.fill();

                });

            });


            fireworks =
                fireworks.filter(function (particles) {

                    return particles.some(function (p) {

                        return p.life > 0;

                    });

                });


            requestAnimationFrame(animate);
        }

        animate();


        /* SCREEN RESIZE */

        window.addEventListener("resize", function () {

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

        });

    </script>

</body>

</html>
